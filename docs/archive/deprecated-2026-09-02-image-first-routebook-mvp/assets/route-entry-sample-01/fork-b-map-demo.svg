<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">岔路重点图 B 示意图</title>
  <desc id="desc">评审级处理过地图图像示意，展示接近龙井村前的游客分流岔路，强调推荐方向与误入方向的区别。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ea"/>
      <stop offset="100%" stop-color="#fcf6eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#264436" flood-opacity="0.13"/>
    </filter>
    <style>
      .label { font: 600 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #22362a; }
      .sub { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4f6454; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36503d; }
      .tag { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .big { font: 700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #244236; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="url(#bg)"/>
  <rect x="52" y="52" width="1336" height="920" rx="34" fill="#fffdf8" filter="url(#shadow)"/>

  <g transform="translate(92 86)">
    <text class="label" x="0" y="0">岔路重点图 B · 龙井前游客分流岔路</text>
    <text class="sub" x="0" y="40">这里不是“看谁多就跟谁走”，而是要以路书方向和参照物为准</text>
    <rect x="983" y="-22" width="214" height="42" rx="21" fill="#cb6d56"/>
    <text class="tag" x="1090" y="6" text-anchor="middle">中高风险提醒</text>
  </g>

  <g transform="translate(92 166)">
    <rect x="0" y="0" width="824" height="738" rx="28" fill="#eef5e8" stroke="#dae5d3"/>
    <path d="M126 598 C198 552, 288 485, 380 428 S562 322, 686 246" fill="none" stroke="#dce8d7" stroke-width="150" stroke-linecap="round" opacity="0.62"/>
    <path d="M381 428 C455 442, 540 466, 654 518 S806 581, 892 612" fill="none" stroke="#cf6760" stroke-width="18" stroke-linecap="round" stroke-dasharray="16 12"/>
    <path d="M124 598 C193 549, 282 482, 375 423 S557 320, 681 250" fill="none" stroke="#254f43" stroke-width="14" stroke-linecap="round"/>
    <path d="M124 598 C193 548, 280 481, 372 423 S553 319, 679 251" fill="none" stroke="#f08d49" stroke-width="20" stroke-linecap="round"/>
    <polygon points="710,234 670,251 681,212" fill="#f08d49"/>
    <path d="M380 428 C456 441, 545 467, 662 519 S818 585, 910 618" fill="none" stroke="#cf6760" stroke-width="64" stroke-linecap="round" opacity="0.14"/>

    <circle cx="380" cy="428" r="18" fill="#fff" stroke="#254f43" stroke-width="6"/>
    <circle cx="681" cy="250" r="18" fill="#fff" stroke="#254f43" stroke-width="6"/>
    <circle cx="570" cy="343" r="14" fill="#fff" stroke="#c57b35" stroke-width="5"/>

    <g>
      <rect x="420" y="448" width="246" height="94" rx="18" fill="#f2fbf3" stroke="#cde5cf"/>
      <text class="small" x="446" y="486">推荐方向</text>
      <text class="big" x="446" y="528">继续朝休息点 / 下撤走</text>

      <rect x="572" y="566" width="246" height="96" rx="18" fill="#fff4f4" stroke="#e5a4a1"/>
      <text class="small" x="598" y="603">易误入方向</text>
      <text class="label" x="598" y="638" font-size="22">盲目跟着人流偏走</text>
    </g>

    <g>
      <rect x="548" y="210" width="246" height="92" rx="18" fill="#fff" stroke="#d9e3d0"/>
      <text class="small" x="574" y="248">终点 / 收束方向</text>
      <text class="label" x="574" y="282" font-size="22">看到休息点即可收束</text>

      <rect x="110" y="640" width="258" height="82" rx="18" fill="#fff" stroke="#d9e3d0"/>
      <text class="small" x="136" y="676">进入这张图前一刻</text>
      <text class="label" x="136" y="708" font-size="20">你已经接近龙井边缘</text>
    </g>
  </g>

  <g transform="translate(958 166)">
    <rect x="0" y="0" width="380" height="738" rx="28" fill="#fbfcf8" stroke="#dde6d8"/>

    <g transform="translate(28 28)">
      <text class="label" x="0" y="0">真实图占位</text>
      <rect x="0" y="30" width="324" height="222" rx="22" fill="#eef6ef"/>
      <image href="./longjing-tea-plantation-real-wikimedia.jpg" x="16" y="16" width="136" height="190" preserveAspectRatio="xMidYMid slice"/>
      <text class="small" x="172" y="66">当前用龙井茶园图</text>
      <text class="small" x="172" y="102">帮助传达“龙井接近段”</text>
      <text class="small" x="172" y="138">正式版应替换为村落边缘</text>
      <text class="small" x="172" y="174">分流点的真实现场图</text>
    </g>

    <g transform="translate(28 286)">
      <rect x="0" y="0" width="324" height="160" rx="22" fill="#fff9ef" stroke="#ecd8b1"/>
      <text class="label" x="18" y="38">用户应观察什么</text>
      <text class="small" x="18" y="76">- 村落边缘的空间收束感</text>
      <text class="small" x="18" y="110">- 人流分向而不是单一前行</text>
      <text class="small" x="18" y="144">- 休息点或道路撤离提示</text>
    </g>

    <g transform="translate(28 476)">
      <rect x="0" y="0" width="324" height="214" rx="22" fill="#f6faf5" stroke="#dde6d8"/>
      <text class="label" x="18" y="34">正式版表达建议</text>
      <text class="small" x="18" y="72">- 真实地图上做方向强化</text>
      <text class="small" x="18" y="108">- 手绘箭头适合表达“跟人流走错”</text>
      <text class="small" x="18" y="144">- 3D 视角适合表达村落边缘转折</text>
      <text class="small" x="18" y="180">- 两种都要保留真实节点关系</text>
    </g>
  </g>
</svg>
